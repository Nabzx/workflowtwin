services:
  api:
    build:
      context: .
    environment:
      WORKFLOWTWIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-workflowtwin}:${POSTGRES_PASSWORD:-workflowtwin}@db:5432/${POSTGRES_DB:-workflowtwin}
      WORKFLOWTWIN_ENVIRONMENT: local
      WORKFLOWTWIN_LOG_LEVEL: INFO
      WORKFLOWTWIN_SERVICE_NAME: workflowtwin-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowtwin}
      POSTGRES_USER: ${POSTGRES_USER:-workflowtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflowtwin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-workflowtwin} -d ${POSTGRES_DB:-workflowtwin}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

